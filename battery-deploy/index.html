<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  /* Coral theme: #f15747 is the brand accent for surfaces and large elements.
     Small text and selected-state fills use darker derivatives so all text meets WCAG AA:
     --accent-mid #d13a28 (4.6:1 with white), --accent-deep #b3301f (6.1:1 with white). */
  :root {
    --bg:#fafafa; --surface:#ffffff; --border:#e5e7eb; --border-strong:#d4d4d8;
    --text:#18181b; --text-2:#3f3f46; --muted:#71717a;
    --accent:#f15747; --accent-mid:#d13a28; --accent-deep:#b3301f; --accent-soft:#fdece9;
    --accent-line:#f6d3cc;
    --green:#1a8a5c; --red:#c04437;
    --radius:8px;
    --shadow:0 1px 2px rgba(0,0,0,0.04), 0 1px 4px rgba(0,0,0,0.04);
  }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font-family:"Inter",-apple-system,system-ui,sans-serif;
    font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased; }
  .shell { max-width:820px; margin:0 auto; padding:24px 24px 100px; }
  header.top { display:flex; align-items:center; justify-content:space-between; padding:6px 0 18px; }
  .wordmark { font-size:13.5px; font-weight:600; letter-spacing:-0.01em; color:var(--text); }
  .wordmark span { color:var(--muted); font-weight:400; }
  .badge { font-size:11.5px; font-weight:500; color:var(--muted);
    border:1px solid var(--border); background:var(--surface); padding:4px 10px; border-radius:999px; }
  h1 { font-size:26px; font-weight:600; letter-spacing:-0.02em; margin-bottom:14px; }
  h2 { font-size:20px; font-weight:600; letter-spacing:-0.01em; margin:0 0 6px; }
  .kicker { font-size:11.5px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--accent-deep); margin-bottom:10px; }
  .lede { font-size:16.5px; color:var(--text-2); max-width:70ch; margin-bottom:14px; }
  .sec-desc { font-size:15px; color:var(--text-2); max-width:70ch; margin-bottom:6px; }
  .meta-chips { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0; }
  .chip { font-size:12.5px; font-weight:500; color:var(--text-2); border:1px solid var(--border);
    background:var(--surface); border-radius:999px; padding:5px 12px; }

  .progress-wrap { position:sticky; top:0; z-index:20; background:rgba(250,250,250,0.96);
    backdrop-filter:blur(6px); border-bottom:1px solid var(--border); margin:0 -24px 22px; padding:10px 24px 12px; }
  .progress-wrap .meta { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .progress-wrap .where { font-size:14px; font-weight:600; color:var(--text); }
  .progress-wrap .count { font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .progress-track { height:3px; background:var(--border); border-radius:2px; margin-top:8px; overflow:hidden; }
  .progress-fill { height:100%; width:0%; background:var(--accent); transition:width .2s; }

  .stem { font-size:18.5px; font-weight:600; letter-spacing:-0.01em; line-height:1.45; color:var(--text);
    background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent);
    border-radius:var(--radius); padding:15px 19px; margin:18px 0 20px; }

  .item { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:17px 19px; margin-bottom:12px; }
  .item .text { font-size:16.5px; font-weight:500; color:var(--text); line-height:1.5; margin-bottom:13px; }
  .opts { display:grid; grid-template-columns:repeat(5,1fr); gap:7px; }
  .opts.three { grid-template-columns:repeat(3,1fr); max-width:420px; }
  .opts.two { grid-template-columns:repeat(2,1fr); max-width:300px; }
  .opt { border:1px solid var(--border); background:var(--surface); border-radius:8px; padding:9px 5px;
    display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; transition:all .1s; }
  .opt:hover { border-color:var(--accent); background:var(--accent-soft); }
  .opt .l { font-size:12px; color:var(--muted); text-align:center; line-height:1.25; }

  .checkrow input { margin-top:3px; flex:none; width:16px; height:16px; accent-color:var(--accent-mid); cursor:pointer; }

  .consent-box[open] summary { border-bottom:1px solid var(--border); }
  .consent-body { padding:6px 18px 18px; font-size:13.5px; line-height:1.55; color:var(--muted); }

  .consent-check input { margin:2px 0 0; flex:none; width:16px; height:16px; accent-color:var(--accent-mid); cursor:pointer; }

  .navrow { display:flex; align-items:center; gap:14px; margin-top:24px; }
  .navrow .spacer { margin-right:auto; }
  .btn { font-size:14px; font-weight:600; padding:11px 22px; border-radius:8px; cursor:pointer; border:1px solid; transition:all .12s; font-family:inherit; }
  .btn-primary { background:var(--accent-mid); color:#fff; border-color:var(--accent-mid); }
  .btn-primary:hover { background:var(--accent-deep); }
  .btn-primary:disabled { opacity:.5; cursor:default; }
  .btn-ghost { background:var(--surface); color:var(--text-2); border-color:var(--border-strong); }
  .btn-ghost:hover { border-color:var(--accent-mid); color:var(--accent-deep); }
  .status { font-size:14px; }
  .status.ok { color:var(--green); font-weight:500; }
  .status.err { color:var(--red); font-weight:500; }
  .rescue { display:none; background:var(--surface); border:1px solid var(--red); border-left:3px solid var(--red);

  .profile-card .band { display:inline-block; font-size:11.5px; font-weight:600; letter-spacing:0.05em;

  .band.low { background:#fdece9; color:var(--accent-deep); }
  .band.medium { background:#fef3e2; color:#92600a; }
  .band.high { background:#e6f4ec; color:var(--green); }

    .shell { padding:16px 14px 80px; }
    h1 { font-size:22px; }

</style>

const SUPABASE_URL = "https://jddrxzirkkmpsqqrmsea.supabase.co";

/* Shares the CPA project's cpa_responses table; rows distinguished by kind:"battery". */
async function saveToBackend(payload) {
  let lastErr = null;
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 20000);
      const res = await fetch(`${SUPABASE_URL}/rest/v1/cpa_responses`, {
        method:"POST",
        headers:{ "Content-Type":"application/json", "apikey":SUPABASE_ANON_KEY,
          "Authorization":`Bearer ${SUPABASE_ANON_KEY}`, "Prefer":"return=minimal" },
        body: JSON.stringify({ kind: payload.kind, version: payload.version || null,
          respondent: payload.respondent || null, payload }),
        signal: ctrl.signal,
      });
      clearTimeout(timer);
      if (!res.ok) throw new Error(`Save failed (${res.status}): ${await res.text()}`);
      return;
    } catch (err) {
      lastErr = err;
      if (attempt < 3) await new Promise(r => setTimeout(r, attempt * 1500));
    }
  }
  throw lastErr;
}

/* ================= Steps ================= */
function buildSteps() {
  const steps = ["cover"];
  if (CONFIG.shareConsent) steps.push("share");
  steps.push("pa","ar","pe","wt","recent","civic");
  if (CONFIG.expansions.community) steps.push("community");
  if (CONFIG.expansions.voice) steps.push("voice");
  if (CONFIG.expansions.cpa) steps.push("cpa");
  if (CONFIG.expansions.traits) steps.push("traits");
  steps.push("about","done");
  return steps;
}
const STEPS = buildSteps();
const STEP_TITLES = {
  cover:"Welcome", share:"Sharing your results", pa:"Taking Action", ar:"Naming Your Needs",
  pe:"Your Part in the Group", wt:"Working Together", recent:"Your recent experience",
  civic:"Your civic life", community:"More About Your Community", voice:"Your Political Voice",

};

/* ================= State + persistence (bulletproofing) ================= */
const BAT_STORE = "agency_battery_v01";
let state = { step:0, answers:{}, participation:[], share:{aggregate:false, individual:false, none:false},
  demo:{}, submitted:false, startedAt:new Date().toISOString() };
try {
  const saved = JSON.parse(localStorage.getItem(BAT_STORE) || "null");
  if (saved && saved.answers) { state = Object.assign(state, saved); }
} catch (e) {}
function persist() { try { localStorage.setItem(BAT_STORE, JSON.stringify(state)); } catch (e) {} }
window.addEventListener("beforeunload", e => {
  if (state.submitted || Object.keys(state.answers).length === 0) return;
  e.preventDefault(); e.returnValue = "";
});

const stage = document.getElementById("stage");
function setChrome() {
  const wrap = document.getElementById("progress-wrap");
  const key = STEPS[state.step];
  if (key === "cover" || key === "done") { wrap.style.display = "none"; return; }
  wrap.style.display = "";
  document.getElementById("where").textContent = STEP_TITLES[key];
  document.getElementById("count").textContent = `Section ${state.step} of ${STEPS.length - 2}`;
  document.getElementById("fill").style.width = (100 * state.step / (STEPS.length - 1)) + "%";
}
function go(n) { state.step = n; persist(); render(); window.scrollTo(0, 0); }

/* ================= Rendering ================= */
function chipRow(id, scale, cols) {
  const cur = state.answers[id];
  const cls = cols === 3 ? "opts three" : cols === 2 ? "opts two" : "opts";
  return `<div class="${cls}" role="radiogroup">` + scale.map((label, v) =>
    `<div class="opt${cur === v ? " sel" : ""}" role="radio" tabindex="0" aria-checked="${cur === v}"
      data-id="${id}" data-val="${v}"><span class="l">${label}</span></div>`).join("") + `</div>`;
}
function itemCards(items, scale) {
  return items.map(it =>
    `<div class="item"><div class="text">${it.t}</div>${chipRow(it.id, scale)}</div>`).join("");
}
function navButtons(backTo, nextLabel, nextEnabled) {
  return `<div class="navrow"><button class="btn btn-ghost" onclick="go(${backTo})">&larr; Back</button>
    <span class="spacer"></span><span class="status" id="gate-note"></span>
    <button class="btn btn-primary" id="next-btn" ${nextEnabled ? "" : "disabled"}
      onclick="go(${state.step + 1})">${nextLabel} &rarr;</button></div>`;
}

function renderShare() {
  const s = state.share;
  stage.innerHTML = `
    <h2>Sharing your results within your organization</h2>
    <p class="sec-desc">Your responses to this survey are used for the research study described earlier. Separately, your organization may also want to use survey results to support organizing coaching and team development. Sharing your results this way is entirely optional and separate from your participation in the research study itself. Whatever you choose here will not affect your standing in your organization, your relationship with the research team, or your ability to take part in this study.</p>
    <p class="sec-desc" style="margin:14px 0 10px"><b>Please choose your preference(s):</b></p>
    <div class="checks">
      <label class="checkrow${s.aggregate ? " on" : ""}"><input type="checkbox" id="sh-agg" ${s.aggregate ? "checked" : ""}>
        <span><b>I agree to let my organization&rsquo;s leaders see aggregate, de-identified results</b> for my team or organization &mdash; combined results where no individual&rsquo;s answers can be identified (for example, only shown when at least 10 people from a team have responded).</span></label>
      <label class="checkrow${s.individual ? " on" : ""}" style="margin-left:26px"><input type="checkbox" id="sh-ind" ${s.individual ? "checked" : ""} ${s.aggregate ? "" : "disabled"}>
        <span><b>I additionally agree to let my organizer and/or team lead see my individual results</b>, for the purpose of a coaching or development conversation. I understand this means my name would be connected to my results for this specific person, that this is different from the confidential research use described above, and that I can withdraw this permission at any time by contacting <a href="mailto:emckenna@hks.harvard.edu">emckenna@hks.harvard.edu</a> without affecting my participation in the study overall.</span></label>
      <label class="checkrow${s.none ? " on" : ""}"><input type="checkbox" id="sh-none" ${s.none ? "checked" : ""}>
        <span><b>I do not wish to share my results with my organization</b> at all and wish for it to remain confidential.</span></label>
    </div>
    ${navButtons(state.step - 1, "Continue", s.aggregate || s.none)}`;
  const sync = () => { renderShare(); persist(); };
  document.getElementById("sh-agg").addEventListener("change", function () {
    state.share.aggregate = this.checked;
    if (!this.checked) state.share.individual = false;
    if (this.checked) state.share.none = false;
    sync();
  });
  document.getElementById("sh-ind").addEventListener("change", function () {
    state.share.individual = this.checked; if (this.checked) state.share.none = false; sync();
  });
  document.getElementById("sh-none").addEventListener("change", function () {
    state.share.none = this.checked;
    if (this.checked) { state.share.aggregate = false; state.share.individual = false; }
    sync();
  });
}

function renderBlock(block) {
  stage.innerHTML = `
    <h2>${block.title}</h2>
    <div class="stem">${block.lead}</div>
    ${itemCards(block.items, block.scale)}
    ${block.key === "wt" ? `<div class="item"><div class="text">${LF1.t}</div>${chipRow(LF1.id, LF1.scale)}</div>` : ""}
    ${navButtons(state.step - 1, "Continue", blockDone(block))}`;
}
function blockDone(block) {
  const ids = block.items.map(i => i.id).concat(block.key === "wt" ? [LF1.id] : []);
  return ids.every(id => id in state.answers);
}

function renderRecent() {
  stage.innerHTML = `
    <h2>Your recent experience</h2>

    <div class="checks">${PARTICIPATION.map((p, i) =>

}

/* ================= Scoring for the agency profile (results:"profile") =================
   Frequency items are 0-4; reverse items flipped. Bands: low = mean < 1.7,
   high = mean > 2.7, medium otherwise. Participation index: sum of codes,
   high 4-10, medium 2-3, low 0-1 (per battery spec). */
function blockMean(items) {
  const vals = items.map(it => {
    let v = state.answers[it.id];
    if (v == null) return null;
    return it.rev ? 4 - v : v;
  }).filter(v => v != null);
  return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
}
function band(mean) { return mean == null ? null : mean < 1.7 ? "low" : mean > 2.7 ? "high" : "medium"; }
function participationIndex() {
  return state.participation.reduce((n, i) => n + PARTICIPATION[i].code, 0);
}
const PROFILE_TEXT = {
  pa: { low:"This might be a good moment for a 1:1 conversation focused on a concrete, doable next step. You might be carrying more than you are able to act on right now. What is one thing, even small, that is fully within your control this week?",
        medium:"What is a slightly bigger task that you can take on next?",
        high:"You act on what matters to you consistently. Who is someone you could mentor through this same process?" },
  ar: { low:"Engage in opportunities to practice naming what you want — a 1:1 conversation or political education session could help. Naming what you want and why is a skill, not something you have or don’t have.",
        medium:"You can often name what you want. Practice saying it out loud (in a meeting, an event, etc.) to others.",
        high:"You’re clear about what you and others want. Consider facilitating a group visioning or strategy session." },
  pe: { low:"It may not feel like your piece of this matters. Ask your team lead directly: What would change if I stepped back?",
        medium:"You’re beginning to see your contributions land. What does it look like to take on one more responsibility?",
        high:"You clearly see your impact on your group. Consider bringing in and developing another person." },
  ce: { low:"It is hard to believe organizing changes anything when you haven’t seen a win yet. Ask your team lead to hear about a past win from your organization’s history.",
        medium:"You believe your group can build toward something. Getting closer to strategy-building may deepen this belief.",
        high:"You believe in your group’s capacity to win. You are ready to help shape strategy, not just execute it." },
  gc: { low:"It is hard to feel alone. Consider talking with others (in a safe space) who share your background about shared stakes.",
        medium:"You are starting to connect your fate to others who share your background. Naming this connection out loud in a group setting may deepen it.",
        high:"You feel strongly connected to others who share your background. This is a powerful anchor for sustained organizing and is a strength." },
};
function renderProfile() {
  const dims = [
    { key:"pa", name:"Taking Action", items:CORE_BLOCKS[0].items },
    { key:"ar", name:"Naming Your Needs", items:CORE_BLOCKS[1].items },
    { key:"pe", name:"Your Part in the Group", items:CORE_BLOCKS[2].items },
    { key:"ce", name:"Working Together — building change", items:CORE_BLOCKS[3].items.slice(0, 3) },
    { key:"gc", name:"Working Together — standing in community", items:CORE_BLOCKS[3].items.slice(3, 5) },
  ];
  const pIdx = participationIndex();
  const pBand = pIdx >= 4 ? "high" : pIdx >= 2 ? "medium" : "low";
  const collective = dims.filter(d => d.key === "ce" || d.key === "pe");
  const collHigh = collective.every(d => band(blockMean(d.items)) === "high");
  const gap = collHigh && pBand === "low";
  return `
    <h2>Your agency profile</h2>
    <p class="sec-desc">These reflections are for you. They are prompts for your own organizing development, not evaluations.</p>
    ${dims.map(d => {
      const b = band(blockMean(d.items));
      return `<div class="profile-card"><span class="dim">${d.name}</span><span class="band ${b}">${b}</span>
        <div class="advice">${PROFILE_TEXT[d.key][b]}</div></div>`;
    }).join("")}
    <div class="profile-card"><span class="dim">Recent participation</span><span class="band ${pBand}">${pBand}</span>
      <div class="advice">Based on how you have taken part in civic or political life in the last 8 months.</div></div>
    ${gap ? `<div class="gapnote"><b>Worth noticing:</b> your sense of what your group can do together is high, but your recent participation has been light. What would it look like to put that belief into action this month?</div>` : ""}`;
}

function renderDone() {
  const profile = CONFIG.results === "profile" ? renderProfile() : "";
  stage.innerHTML = `
    ${profile || "<h2>Thank you</h2><p class='sec-desc'>Thank you for your participation in this research. We will use your responses to learn more about the related constructs and share our findings as a way to better understand, and hopefully improve, organizing programs at large.</p>"}
    <p class="sec-desc" style="margin-top:22px">Thank you again. Please feel free to come back and take this again in a few months!</p>
    <p class="sec-desc" style="color:var(--muted); font-size:13px; margin-top:10px"><em>Demo only &mdash; validation in progress.</em></p>`;
}

/* ================= Submit ================= */
function exportBackup(payload) {
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `agency-battery-${(state.demo.name || "anonymous").toLowerCase().replace(/[^a-z0-9]+/g, "-")}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}
function buildPayload() {
  return {
    kind: "battery",
    instrument: "agency_full_battery",
    version: "battery-v0.1-aug2026",
    config: CONFIG,
    share_consent: CONFIG.shareConsent ? state.share : null,
    respondent: state.demo.name || null,
    answers: state.answers,
    participation: state.participation.map(i => ({ code: PARTICIPATION[i].code, label: PARTICIPATION[i].t })),
    participation_index: participationIndex(),
    demographics: state.demo,
    startedAt: state.startedAt,
    submittedAt: new Date().toISOString(),
  };
}
async function submitAll() {
  const btn = document.getElementById("submit-btn");
  const status = document.getElementById("save-status");
  btn.disabled = true; status.className = "status"; status.textContent = "Saving…";
  const payload = buildPayload();
  try {
    await saveToBackend(payload);
    state.submitted = true; persist();
    go(STEPS.indexOf("done"));
  } catch (err) {
    btn.disabled = false;
    status.textContent = "";
    exportBackup(payload);
    document.getElementById("rescue-detail").textContent = `(${err.message})`;
    document.getElementById("rescue").style.display = "block";
  }
}

/* ================= Wire-up ================= */
stage.addEventListener("click", e => {
  const o = e.target.closest(".opt");
  if (!o) return;
  state.answers[o.dataset.id] = Number(o.dataset.val);
  persist();
  render();
});
stage.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const o = e.target.closest(".opt");
  if (o) { e.preventDefault(); o.click(); }
});

function render() {
  setChrome();
  const key = STEPS[state.step];
  if (key === "cover") return renderCover();
  if (key === "share") return renderShare();
  if (key === "pa") return renderBlock(CORE_BLOCKS[0]);
  if (key === "ar") return renderBlock(CORE_BLOCKS[1]);
  if (key === "pe") return renderBlock(CORE_BLOCKS[2]);
  if (key === "wt") return renderBlock(CORE_BLOCKS[3]);
  if (key === "recent") return renderRecent();
  if (key === "civic") return renderCivic();
  if (key === "community") return renderCommunity();
  if (key === "voice") return renderVoice();
  if (key === "cpa") return renderCpa();
  if (key === "traits") return renderTraits();
  if (key === "about") return renderAbout();
  if (key === "done") return renderDone();
}
if (state.submitted) state.step = STEPS.indexOf("done");
if (state.step >= STEPS.length) state.step = 0;
render();
</script>
